[package]
name = "cargo-lint-audit"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "An experimental inventory and diagnostic comparison for Rust lint acknowledgements"

[dependencies]
proc-macro2 = { version = "1", features = ["span-locations"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syn = { version = "2", features = ["full", "visit"] }
toml = "0.8"
